name: Build & Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS (universal)
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev \
            libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev ninja-build

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.14-${{ runner.os }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Run test harness
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: secret-sauce-${{ runner.os }}
          path: |
            build/SecretSauce_artefacts/**/VST3/**
            build/SecretSauce_artefacts/**/AU/**
            build/SecretSauce_artefacts/**/Standalone/**
          if-no-files-found: warn

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            installer\windows\SecretSauce.iss `
            /DVersion=1.0.0 `
            /DBuildDir=..\..\build\SecretSauce_artefacts\Release `
            /DOutputDir=..\..\build\installer

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: secret-sauce-windows-installer
          path: build/installer/*.exe
          if-no-files-found: error
